<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 44" fill="none">
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E61D7F"/>
      <stop offset="100%" stop-color="#CB3AA6"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B1C5C"/>
      <stop offset="100%" stop-color="#4B255D"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Berry cluster -->
  <circle cx="14" cy="28" r="9.5" fill="url(#b1)" filter="url(#glow)"/>
  <circle cx="30" cy="24" r="9" fill="url(#b2)"/>
  <circle cx="22" cy="13" r="8.5" fill="#9B2D8A"/>

  <!-- Highlight specular dots -->
  <circle cx="11" cy="25" r="2.8" fill="rgba(255,255,255,0.22)"/>
  <circle cx="27" cy="21" r="2.4" fill="rgba(255,255,255,0.15)"/>
  <circle cx="19" cy="10" r="2.2" fill="rgba(255,255,255,0.2)"/>

  <!-- Stem + tiny leaf -->
  <path d="M22 4 Q24 9 22 13" stroke="#A2CC24" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M22 7 Q29 4 27 10" stroke="#A2CC24" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Text: açaí map -->
  <text x="48" y="23" font-family="Poppins, sans-serif" font-weight="800" font-size="16" fill="white" letter-spacing="-0.5">açaí map</text>
  <text x="49" y="37" font-family="Poppins, sans-serif" font-weight="500" font-size="9" fill="rgba(255,255,255,0.55)" letter-spacing="3.5">BELÉM · PA</text>
</svg>
